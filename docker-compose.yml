services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sovara
      POSTGRES_PASSWORD: sovara_dev_password
      POSTGRES_DB: sovara_db
      # DEV-ONLY: disables password checking entirely for local development.
      # NEVER use POSTGRES_HOST_AUTH_METHOD=trust in any shared, staged, or
      # production environment — it accepts any connection with no auth.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: